resources:
  jobs:
    ingestionjob:
      name: ingestionjob
      tasks:
        - task_key: Ingestionjob
          notebook_task:
            notebook_path: ../../src/ingestion.py
            base_parameters:
              catalog_name: ${var.catalog_name}
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
