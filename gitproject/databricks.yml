# This is a Databricks asset bundle definition for gitproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: gitproject
  uuid: 670e2e48-9ff4-4bde-8578-84bbb020ed68

include:
  - resources/*.yml
  - resources/*/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-230f0f8a-1243.cloud.databricks.com/
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-230f0f8a-1243.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/likeedos@live.co.uk to make sure we only have a single copy.
      root_path: /Workspace/Users/likeedos@live.co.uk/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - group_name: admins
        level: CAN_MANAGE
